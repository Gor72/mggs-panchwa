<!-- CDN Libraries for PDF Generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
function generateMDMRealPDF() {
    const element = document.getElementById('pdfTemplate');
    if (!element) {
        alert("त्रुटि: PDF टेंपलेट नहीं मिला!");
        return;
    }

    // डेटा अपडेट करें
    document.getElementById('pSchoolCode').innerText = document.getElementById('schoolCode').value;
    document.getElementById('pReportDate').innerText = document.getElementById('reportDate').value;
    document.getElementById('pMonthName').innerText = document.getElementById('monthName').value;

    // 1 से 5 डेटा
    const c15_w_op = parseFloat(document.getElementById('c15_w_op').value) || 0;
    const c15_w_rec = parseFloat(document.getElementById('c15_w_rec').value) || 0;
    const c15_w_con = parseFloat(document.getElementById('c15_w_con').value) || 0;
    const c15_w_rem = (c15_w_op + c15_w_rec) - c15_w_con;

    const c15_r_op = parseFloat(document.getElementById('c15_r_op').value) || 0;
    const c15_r_rec = parseFloat(document.getElementById('c15_r_rec').value) || 0;
    const c15_r_con = parseFloat(document.getElementById('c15_r_con').value) || 0;
    const c15_r_rem = (c15_r_op + c15_r_rec) - c15_r_con;

    document.getElementById('p_c15_enr').innerText = document.getElementById('c15_enr').value;
    document.getElementById('p_c15_w_op').innerText = c15_w_op.toFixed(3);
    document.getElementById('p_c15_r_op').innerText = c15_r_op.toFixed(3);
    document.getElementById('p_c15_w_rec').innerText = c15_w_rec.toFixed(3);
    document.getElementById('p_c15_r_rec').innerText = c15_r_rec.toFixed(3);
    document.getElementById('p_c15_w_con').innerText = c15_w_con.toFixed(3);
    document.getElementById('p_c15_r_con').innerText = c15_r_con.toFixed(3);
    document.getElementById('p_c15_w_rem').innerText = c15_w_rem.toFixed(3);
    document.getElementById('p_c15_r_rem').innerText = c15_r_rem.toFixed(3);
    document.getElementById('p_c15_ben').innerText = document.getElementById('c15_ben').value;
    document.getElementById('p_c15_exp').innerText = document.getElementById('c15_exp').value;

    // 6 से 8 डेटा
    const c68_w_op = parseFloat(document.getElementById('c68_w_op').value) || 0;
    const c68_w_rec = parseFloat(document.getElementById('c68_w_rec').value) || 0;
    const c68_w_con = parseFloat(document.getElementById('c68_w_con').value) || 0;
    const c68_w_rem = (c68_w_op + c68_w_rec) - c68_w_con;

    const c68_r_op = parseFloat(document.getElementById('c68_r_op').value) || 0;
    const c68_r_rec = parseFloat(document.getElementById('c68_r_rec').value) || 0;
    const c68_r_con = parseFloat(document.getElementById('c68_r_con').value) || 0;
    const c68_r_rem = (c68_r_op + c68_r_rec) - c68_r_con;

    document.getElementById('p_c68_enr').innerText = document.getElementById('c68_enr').value;
    document.getElementById('p_c68_w_op').innerText = c68_w_op.toFixed(3);
    document.getElementById('p_c68_r_op').innerText = c68_r_op.toFixed(3);
    document.getElementById('p_c68_w_rec').innerText = c68_w_rec.toFixed(3);
    document.getElementById('p_c68_r_rec').innerText = c68_r_rec.toFixed(3);
    document.getElementById('p_c68_w_con').innerText = c68_w_con.toFixed(3);
    document.getElementById('p_c68_r_con').innerText = c68_r_con.toFixed(3);
    document.getElementById('p_c68_w_rem').innerText = c68_w_rem.toFixed(3);
    document.getElementById('p_c68_r_rem').innerText = c68_r_rem.toFixed(3);
    document.getElementById('p_c68_ben').innerText = document.getElementById('c68_ben').value;
    document.getElementById('p_c68_exp').innerText = document.getElementById('c68_exp').value;

    // कुल 1 से 8
    document.getElementById('p_tot_enr').innerText = (parseInt(document.getElementById('c15_enr').value)||0) + (parseInt(document.getElementById('c68_enr').value)||0);
    document.getElementById('p_tot_w_op').innerText = (c15_w_op + c68_w_op).toFixed(3);
    document.getElementById('p_tot_r_op').innerText = (c15_r_op + c68_r_op).toFixed(3);
    document.getElementById('p_tot_w_rec').innerText = (c15_w_rec + c68_w_rec).toFixed(3);
    document.getElementById('p_tot_r_rec').innerText = (c15_r_rec + c68_r_rec).toFixed(3);
    document.getElementById('p_tot_w_con').innerText = (c15_w_con + c68_w_con).toFixed(3);
    document.getElementById('p_tot_r_con').innerText = (c15_r_con + c68_r_con).toFixed(3);
    document.getElementById('p_tot_w_rem').innerText = (c15_w_rem + c68_w_rem).toFixed(3);
    document.getElementById('p_tot_r_rem').innerText = (c15_r_rem + c68_r_rem).toFixed(3);
    document.getElementById('p_tot_ben').innerText = (parseInt(document.getElementById('c15_ben').value)||0) + (parseInt(document.getElementById('c68_ben').value)||0);
    document.getElementById('p_tot_exp').innerText = (parseFloat(document.getElementById('c15_exp').value)||0) + (parseFloat(document.getElementById('c68_exp').value)||0);

    // दूध व वित्ती माहिती
    const m_op_15 = parseFloat(document.getElementById('m_op_15').value) || 0;
    const m_op_68 = parseFloat(document.getElementById('m_op_68').value) || 0;
    const m_con_15 = parseFloat(document.getElementById('m_con_15').value) || 0;
    const m_con_68 = parseFloat(document.getElementById('m_con_68').value) || 0;

    document.getElementById('p_mb_15').innerText = document.getElementById('c15_ben').value;
    document.getElementById('p_mb_68').innerText = document.getElementById('c68_ben').value;
    document.getElementById('p_mo_15').innerText = m_op_15.toFixed(3);
    document.getElementById('p_mo_68').innerText = m_op_68.toFixed(3);
    document.getElementById('p_mc_15').innerText = m_con_15.toFixed(3);
    document.getElementById('p_mc_68').innerText = m_con_68.toFixed(3);
    document.getElementById('p_mr_15').innerText = (m_op_15 - m_con_15).toFixed(3);
    document.getElementById('p_mr_68').innerText = (m_op_68 - m_con_68).toFixed(3);
    document.getElementById('p_sc_15').innerText = document.getElementById('s_con_15').value;
    document.getElementById('p_sc_68').innerText = document.getElementById('s_con_68').value;

    document.getElementById('p_h_cnt').innerText = document.getElementById('helper_cnt').value;
    document.getElementById('p_h_dem').innerText = document.getElementById('helper_dem').value;
    document.getElementById('p_b_h').innerText = document.getElementById('bal_helper').value;
    document.getElementById('p_b_s').innerText = document.getElementById('bal_sugar').value;
    document.getElementById('p_b_g').innerText = document.getElementById('bal_gas').value;

    // शो टेम्पलेट
    element.classList.remove('d-none');

    const opt = {
        margin:       5,
        filename:     `MDM_Report_${document.getElementById('monthName').value}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    // जनरेट PDF
    if (typeof html2pdf !== 'undefined') {
        html2pdf().set(opt).from(element).save().then(() => {
            element.classList.add('d-none');
        }).catch(err => {
            alert("PDF बनाने में समस्या: " + err);
            element.classList.add('d-none');
        });
    } else {
        alert("PDF लाइब्रेरी लोड नहीं हो पाई। कृपया इंटरनेट कनेक्शन जांचें या पेज रिफ्रेश करें।");
        element.classList.add('d-none');
    }
}
</script>
