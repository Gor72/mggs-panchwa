<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Entry Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Print / PDF me School Type wale column ko hide karne ke liye */
    @media print {
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="p-3 bg-light">

  <div class="container-fluid bg-white p-4 rounded shadow-sm">
    <h5 class="fw-bold mb-3" style="font-size: 16px; text-transform: uppercase;">OFFICE NAME</h5>
    
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead class="table-dark text-center">
          <tr>
            <th>क्र.सं.</th>
            <th>स्कूल का नाम</th>
            <!-- Ye Column Screen par dikhega par Print/PDF me nahi aayega -->
            <th class="no-print">स्कूल का प्रकार</th> 
            <th>कक्षा 1-5 विवरण</th>
            <th>कक्षा 6-8 विवरण</th>
          </tr>
        </thead>
        <tbody id="schoolTableBody">
          <tr>
            <td class="text-center">1</td>
            <td>
              <input type="text" class="form-control" placeholder="स्कूल का नाम दर्ज करें">
            </td>
            <!-- Dropdown Column -->
            <td class="no-print">
              <select class="form-select school-type-select" onchange="toggleClass6to8(this)">
                <option value="UPPER PRIMARY">UPPER PRIMARY</option>
                <option value="PRIMARY">PRIMARY</option>
              </select>
            </td>
            <td>
              <input type="text" class="form-control class-1-5" placeholder="कक्षा 1-5 डेटा">
            </td>
            <td>
              <input type="text" class="form-control class-6-8" placeholder="कक्षा 6-8 डेटा">
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function toggleClass6to8(selectElement) {
      // Current row ko locate karna
      const row = selectElement.closest('tr');
      
      // Row me majood Class 6-8 wale inputs ko find karna
      const class6to8Inputs = row.querySelectorAll('.class-6-8');

      if (selectElement.value === 'PRIMARY') {
        class6to8Inputs.forEach(input => {
          // Purana data save karke 'लागू नहीं' set karna aur disable karna
          input.dataset.oldValue = input.value;
          input.value = 'लागू नहीं';
          input.disabled = true;
        });
      } else {
        class6to8Inputs.forEach(input => {
          // Unlock karna aur agar pehle koi value thi toh restore karna
          input.disabled = false;
          if (input.dataset.oldValue !== undefined) {
            input.value = input.dataset.oldValue;
          } else {
            input.value = '';
          }
        });
      }
    }
  </script>

</body>
</html>
